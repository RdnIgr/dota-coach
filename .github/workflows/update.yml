name: update-data

on:
  schedule:
    - cron: "17 */3 * * *"   # каждые 3 часа
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "pipeline/**"
      - "players.json"
      - ".github/workflows/update.yml"

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Сбор данных OpenDota
        env:
          OPENDOTA_API_KEY: ${{ secrets.OPENDOTA_API_KEY }}
          DETAILS_LAST_N: "60"
        run: python pipeline/fetch.py

      - name: Анализ
        run: python pipeline/analyze.py

      - name: Коммит данных
        run: |
          git config user.name "dota-coach-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "изменений нет"
          else
            git commit -m "data: обновление $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main || true
            git push
          fi
